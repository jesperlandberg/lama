<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>@lama/motion — carousel</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; }
    html { overflow-x: hidden; overflow-y: hidden; scrollbar-gutter: stable; }
    html.case { overflow-y: auto; }
    body { font: 13px/1 system-ui, sans-serif; min-height: 100vh; }

    /* the document's height in case view — the only thing that scrolls */
    #spacer { height: 0; pointer-events: none; }

    /* the GPU canvas: over the page, under the (hit-testable) cards */
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

    .stage {
      position: fixed; inset: 0; z-index: 2;
      cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none;
    }
    .stage.dragging { cursor: grabbing; }

    /* every card sits centred on the stage; the transform moves it out */
    .card {
      position: absolute; left: 50%; top: 50%;
      width: 320px; height: 220px; margin: -110px 0 0 -160px;
      border-radius: 24px; overflow: hidden; background: #eee;
      transform-origin: 50% 50%; will-change: transform;
      cursor: pointer;
    }
    .card img, .card video { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; pointer-events: none; -webkit-user-drag: none; }
    /* the case study's column planes: not interactive */
    .card.plane { pointer-events: none; cursor: default; }

    /* GL mode: the boxes stay for hit-testing, the pixels move to the canvas.
       The media stays mounted (a clip keeps playing — the canvas imports its
       frames), just invisible. */
    .stage.gl .card { background: transparent; }
    .stage.gl .card img, .stage.gl .card video { opacity: 0 !important; }

    .mode {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3;
      display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: #f0f0f0;
    }
    .mode button {
      font: inherit; border: 0; background: transparent; color: #666; cursor: pointer;
      padding: 7px 14px; border-radius: 999px; letter-spacing: 0.01em;
    }
    .mode button.on { background: #111; color: #fff; }
    .mode button:disabled { color: #bbb; cursor: default; }
  </style>
</head>
<body>
  <div id="spacer"></div>
  <canvas id="gl"></canvas>
  <div class="stage" id="stage"></div>
  <div class="mode" id="mode">
    <button data-mode="dom" class="on">HTML</button>
    <button data-mode="gl">WebGPU</button>
  </div>
  <script type="module" src="./carousel.ts"></script>
</body>
</html>
